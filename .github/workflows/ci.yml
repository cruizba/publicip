name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet -vettool= ./...

  changelog:
    name: Changelog consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check compares commit subjects in the range against CHANGELOG.md.
          fetch-depth: 0

      # Before a version exists there is nothing to extract, but two things can already
      # be caught: a commit subject no tool understands (it would vanish from every
      # description), and a breaking commit whose release note nobody wrote.
      - name: Verify the commits in this change
        if: github.event_name == 'pull_request'
        run: ./scripts/release-notes.sh verify-pr "origin/${{ github.base_ref }}"

      - name: Verify the changelog against the shipped tags
        if: github.event_name == 'push'
        run: |
          latest=$(git describe --tags --abbrev=0 || true)
          [ -n "$latest" ] || { echo "no tags yet"; exit 0; }
          version="${latest#v}"
          if ./scripts/release-notes.sh verify "$version" "$latest^" "$latest" 2>/dev/null; then
            echo "CHANGELOG.md matches $latest"
          else
            # Releases cut before this check existed have no section to agree with.
            echo "::warning::CHANGELOG.md does not describe $latest yet"
          fi

  test:
    name: Test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26.4 is the floor declared in go.mod; 1.27.1 is the current stable.
        # Running on the floor is what proves the go directive is not a lie.
        go: ['1.26.4', '1.27.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Test (race)
        run: go test -race -timeout 300s -count=1 ./...

      - name: Coverage report
        run: |
          go test -timeout 300s -count=1 -covermode=atomic \
            -coverpkg=./... -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1
          # v1 has no coverage gate; the number is reported so a drop is visible.
          # The 100% mandate belongs to v2.

  hermetic:
    name: Tests must not touch the network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace

      # Warm the build cache first: the traced run below must not be blamed for the
      # go command's own module or toolchain traffic.
      - name: Prebuild
        run: go build ./... && go test -run '^$' ./...

      - name: Trace every syscall that can leave the machine
        env:
          GOPROXY: off
          GOTOOLCHAIN: local
        run: |
          strace -f -qq -e trace=connect,sendto,sendmsg -s 40 \
            go test -timeout 300s -count=1 ./... >strace.log 2>&1 || {
              cat strace.log
              exit 1
            }

      - name: Fail if anything reached a non-loopback address
        run: |
          v4=$(grep -oE 'inet_addr\("[^"]+"\)' strace.log | sed -E 's/.*"([^"]+)".*/\1/' | grep -vE '^127\.' | sort -u)
          v6=$(grep -oE 'inet_pton\(AF_INET6, "[^"]+"' strace.log | sed -E 's/.*"([^"]+)".*/\1/' | grep -vE '^::1$' | sort -u)
          if [ -n "$v4" ] || [ -n "$v6" ]; then
            echo "addresses contacted by the test suite:"
            for a in $v4 $v6; do echo "  $a"; done
            echo "::error::a unit test left loopback. Use an IP literal on loopback or in 192.0.2.0/24 as a fixture."
            exit 1
          fi
          echo "hermetic: every address the suite touched was loopback"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...

      # 100% of statements per file, package and total; every exclusion needs a
      # reason in the code, which force-annotation-comment enforces.
      - name: Enforce the coverage threshold
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml

  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tool needs a newer Go than the library's floor (mutago requires >= 1.26.5),
      # so this job deliberately uses the current stable: a toolchain requirement of the
      # checker says nothing about the floor of what is being checked.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # Pinned: 100%-statement-coverage means nothing if the assertions are inert, and
      # this is the check that says so. Verified against mutago v2.10.1: the gate that
      # exits non-zero is --min-covered-msi (4), not --fail-on-escaped, which stays
      # silent when --coverage classifies a survivor as not covered.
      - name: Install mutago
        run: go install github.com/quality-gates/mutago/v2/cmd/mutago@v2.10.1

      - name: Mutate
        run: |
          mutago \
            --coverage \
            --min-covered-msi 84 \
            --baseline=mutago-baseline.json \
            --quiet --no-diffs ./...

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: report.json

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              out="publicip-${os}-${arch}"
              [ "$os" = windows ] && out="$out.exe"
              GOOS=$os GOARCH=$arch go build -o "$out" ./cmd/publicip
            done
          done
          ls -1 publicip-*
