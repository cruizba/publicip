name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are derived from the commit range, so the job needs the full
      # history and the tags; the checkout default of a single commit would leave
      # `git describe --tags` with nothing to compare against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - name: Update version
        run: |
          sed -i "s/const version = \".*\"/const version = \"${{ github.event.inputs.version }}\"/" version.go

      - name: Commit and push changes
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.go
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          # checkout leaves the job on a detached HEAD, so a bare "git push" fails;
          # push explicitly to the branch the workflow was dispatched from so that
          # releases from the v1 maintenance branch land there and not on main.
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Build Binaries
        run: |
          # Build for each OS/arch combination
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              output="publicip-${{ github.event.inputs.version }}-${os}-${arch}"
              if [ "$os" = "windows" ]; then
                output="${output}.exe"
              fi
              GOOS=$os GOARCH=$arch go build -o "$output" ./cmd/publicip
            done
          done

      - name: Generate release notes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # Notes come from the commits in the range, not from merged pull requests:
          # --generate-notes alone describes only PRs, so changes that land directly on
          # main are missing from the release description entirely.
          PREV_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RELEASE_TAG="$VERSION" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              ./scripts/release-notes.sh "$PREV_TAG" HEAD > notes.md
          else
            RELEASE_TAG="$VERSION" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              ./scripts/release-notes.sh HEAD > notes.md
          fi
          echo '----- release notes -----' >&2
          cat notes.md >&2

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          # --target pins the tag to the commit we just pushed on this branch.
          # Without it gh uses the repository default branch, which would tag main
          # even when the release was cut from a maintenance branch.
          gh release create "$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes-file notes.md \
            "publicip-$VERSION-linux-amd64" \
            "publicip-$VERSION-linux-arm64" \
            "publicip-$VERSION-darwin-amd64" \
            "publicip-$VERSION-darwin-arm64" \
            "publicip-$VERSION-windows-amd64.exe" \
            "publicip-$VERSION-windows-arm64.exe"